[package]
name = "sigmaos-storage"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Project"]
description = "Storage management and abstraction"
license = "GPL-3.0-or-later"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-storage"
readme = "README.md"
keywords = ["storage", "disk", "lvm"]
categories = ["os"]

[dependencies]
sigmaos-kernel = { version = "0.1", path = "../SigmaOS-kernel" }
sigmaos-filesystem = { version = "0.1", path = "../SigmaOS-filesystem" }

[profile.release]
opt-level = 3
